name: Update World Cup matches

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if today is not a configured finalization date"
        required: false
        type: boolean
        default: false
  schedule:
    # Runs once after each prior round is complete, timed for overnight Eastern.
    - cron: "30 5 28 6 *"
    - cron: "30 5 4 7 *"
    - cron: "30 5 8 7 *"
    - cron: "30 5 12 7 *"
    - cron: "30 5 16 7 *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update match data
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          FOOTBALL_DATA_COMPETITION: WC
          FOOTBALL_DATA_SEASON: "2026"
          MATCH_DISPLAY_TZ: America/New_York
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python scripts/update_matches.py $FORCE_FLAG

      - name: Commit updated matches
        run: |
          if [ -z "$(git status --porcelain -- matches.json)" ]; then
            echo "No match data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add matches.json
          git commit -m "Update World Cup match data"
          git push
